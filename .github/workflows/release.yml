name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: Version or publish
    if: github.repository == 'thomasfosterau/effect-numeric'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the version commit and tags
      pull-requests: write # open the "Version Packages" pull request
      id-token: write # npm provenance / trusted publishing
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Create release pull request or publish to npm
        uses: changesets/action@v2.1.2
        with:
          version-script: pnpm run changeset:version
          publish-script: pnpm run changeset:publish
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

# pnpm workspace — the single published package `effect-numeric`.
#
# EVERY external dependency version lives here — package.json references only
# `catalog:` / `catalog:peers`. `catalogMode: strict` makes `pnpm add` enforce
# this at add time and `pnpm install` reject non-catalog specifiers. After
# editing this catalog, ALWAYS run `pnpm install` and commit the regenerated
# pnpm-lock.yaml — a stale lockfile fails CI at once with
# ERR_PNPM_LOCKFILE_CONFIG_MISMATCH.
#
# Versions follow the effect-web library family's catalog wherever the two
# overlap (effect, vite-plus, the TypeScript 6/7 pair, fallow).

catalogMode: strict

catalog:
  # `check:dist`: publint + "are the types wrong" against the packed tarball.
  "@arethetypeswrong/cli": ^0.18.5
  "@changesets/changelog-github": ^1.0.1
  "@changesets/cli": ^3.0.3
  "@effect/language-service": ^0.87.5
  # Effect Language Service as a native (TypeScript-Go) binary — the TS7 side
  # of the 6/7 split. `effect-tsgo patch` overwrites the native `tsc` binary
  # with an Effect-patched build matched by gitHead, so this pins in lockstep
  # with `@typescript/native` below (0.63.0 ships against typescript 7.0.2)
  # and with the `oxlint` and `oxlint-tsgolint` that `vite-plus` pulls in
  # (0.63.0 supports oxlint 1.88.0 – 1.90.0 and tsgolint 7.0.2004 / 7.0.2005;
  # vite-plus 1.4.0 carries oxlint 1.89.0 and tsgolint 7.0.2004).
  # Each @effect/tsgo release hard-errors (UnsupportedTargetPackageVersionError)
  # on any other component version, failing `pnpm install` itself. Read the
  # `components` table in node_modules/@effect/tsgo/dist/effect-tsgo.cjs
  # before bumping any of the three.
  "@effect/tsgo": 0.63.0
  "@types/node": ^26.6.5
  # Must equal the vitest that vite-plus bundles (see `vitest` below); vite-plus
  # refuses to run coverage on a mismatch.
  "@vitest/coverage-istanbul": 5.0.5
  # The Effect lint preset (`effect/*` rules, anti-slop included), registered
  # through `jsPlugins` by `configs.recommended`. It depends on `effect`
  # 4.1.0 exactly, which the `effect` override below forces onto the catalog
  # singleton, so the two move together (Dependabot's `toolchain` group).
  "@enfect/oxlint": ^0.9.0
  # Development pin. The published floor is `catalogs.peers.effect`; code
  # must not use an API newer than that floor.
  effect: 4.1.0
  fallow: 3.37.0
  fast-check: ^4.10.2
  publint: ^0.3.25
  tsx: ^4.23.15
  # TypeScript 6/7 side-by-side: TS7 (the native Go compiler) ships no JS API
  # until 7.1, so JS-API consumers (@effect/language-service, tsdown's
  # declaration bundler, @arethetypeswrong/cli) stay on TS6 while native `tsc`
  # type-checks. The alias keeps the package importable as `typescript`
  # name-stable at the TS6 JS compiler (bin `tsc6`); `@typescript/native` is
  # TS7 (bin `tsc`). Pinned exact: @typescript/native's gitHead must match
  # @effect/tsgo's bundled binary.
  typescript: "npm:@typescript/typescript6@6.0.2"
  "@typescript/native": "npm:typescript@7.0.2"
  # vite-plus pins `oxlint`, `oxfmt` and `vitest` to exact versions, so this
  # entry decides the oxlint version `effect-tsgo patch --oxlint` has to
  # support (see the @effect/tsgo note above): 1.4.0 carries oxlint 1.89.0,
  # oxfmt 0.74.0, oxlint-tsgolint 7.0.2004 and vitest 5.0.5. `vite` is the
  # same release under its aliased core package (an npm alias Dependabot
  # cannot bump: move it by hand with vite-plus), and `vitest` must match
  # vite-plus's exact pin (`vp toolchain vitest`) because the `vitest@*`
  # override forces every resolution to the catalog singleton. Upgrade with
  # `pnpm dlx --package=vite-plus@<v> vp migrate --no-interactive`, then drop
  # any `minimumReleaseAgeExclude` entries it adds.
  vite-plus: 1.4.0
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vitest: 5.0.5

# Peer ranges the PUBLISHED package declares. Kept as a named catalog so the
# strict catalog mode still governs them while they stay ranges. `pnpm
# publish` replaces `catalog:peers` with these ranges in the published
# manifest.
catalogs:
  peers:
    # The stable Effect 4 line. Raising the floor is a breaking change.
    effect: ^4.0.0

overrides:
  # `effect` MUST be a singleton: two copies break Equal / Hash / Schema
  # identity at runtime. Force every resolution to the catalog version so a
  # hoisting reshuffle cannot introduce a second copy. This also covers
  # @enfect/oxlint's own `effect` dependency (4.1.0, the catalog pin).
  effect: "catalog:"
  # Vite+'s managed overrides. The `@*` range leaves `catalog:` importer
  # specifiers intact while still forcing transitive and peer ranges onto
  # the catalog singletons (node_modules/vite-plus/docs/guide/upgrade-project.md).
  vite@*: "catalog:"
  vitest@*: "catalog:"
nodeLinker: hoisted
allowBuilds:
  esbuild: true
  fallow: true
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"

# Supply-chain delay (owner's policy, gardeneria #1149, relaxed to 8 hours on
# 2026-10-30): hold newly published versions for 480 MINUTES before pnpm will
# install them. Dependabot's `cooldown` (whole days only) is 1 day, longer than
# this, so it never proposes a version pnpm would still refuse.
minimumReleaseAge: 480
minimumReleaseAgeExclude:
  # @thomasfosterau/* is first-party — exempt so our own releases install immediately.
  - "@thomasfosterau/*"
